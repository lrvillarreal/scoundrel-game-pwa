<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11191e">
<title>Scoundrel — Offline Recovery</title>
<link rel="icon" href="icons/scoundrel.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark;font-family:system-ui;background:#11191e;color:#f5f0e6}
  body{max-width:36rem;margin:12vh auto;padding:1.5rem;line-height:1.6}
  h1{color:#e9bc77}button,a{font:inherit;color:#e9bc77}button{padding:.7rem 1rem;background:#18262c;border:1px solid #e9bc77;border-radius:.5rem;cursor:pointer}
</style>
<h1>Scoundrel</h1>
<h2>Repair offline play</h2>
<p>Connect once to download the complete game again. Your saved game stays on this browser. This will update open Scoundrel windows when they reload.</p>
<button id="repair" type="button">Repair offline files</button>
<p id="status" role="status"></p>
<a href="./">Return to the game</a>
<script>
  const status = document.getElementById('status');
  const button = document.getElementById('repair');
  // Standalone page: recovery does not depend on any cached React/CSS bundle.
  function ask(worker) {
    return new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timer = setTimeout(() => { channel.port1.close(); reject(new Error('Repair timed out. Keep this page online and try again.')); }, 60000);
      channel.port1.onmessage = event => {
        clearTimeout(timer);
        channel.port1.close();
        resolve(event.data);
      };
      worker.postMessage({ type: 'SCOUNDREL_REPAIR' }, [channel.port2]);
    });
  }
  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = 'Downloading and checking the complete game…';
    try {
      const registration = await navigator.serviceWorker.register(new URL('sw.js', location.href), { updateViaCache: 'none' });
      await registration.update();
      let worker = registration.installing || registration.waiting || registration.active;
      if (worker.state === 'installing') {
        await new Promise((resolve, reject) => {
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' || worker.state === 'activated') resolve();
            if (worker.state === 'redundant') reject(new Error('Download failed. Check your connection and retry.'));
          });
        });
      }
      worker = registration.waiting || registration.active;
      const result = await ask(worker);
      if (result.app !== 'scoundrel' || !result.ready) throw new Error('Some files could not be downloaded. Reconnect and retry.');
      if (registration.waiting) {
        const activated = new Promise(resolve => worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') resolve();
        }));
        worker.postMessage({ type: 'SCOUNDREL_ACTIVATE' });
        await activated;
      }
      status.textContent = 'Ready to play offline. Return to the game.';
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
